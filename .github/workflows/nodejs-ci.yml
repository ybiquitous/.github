name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *" # monthly

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["lts/*", "26", "24", "22", "20", "18", "16"]
        os: ["ubuntu-slim"]
    uses: ./.github/workflows/nodejs-test-reusable.yml
    with:
      node-version: ${{ matrix.node-version }}
      os: ${{ matrix.os }}
      node-version-coverage: "22"
      node-version-snapshot: "26"
      coverage-name: coverage
    permissions:
      contents: write

  show-coverage:
    needs: test
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: downloaded/
      - run: ls -lR downloaded/

  lint:
    uses: ./.github/workflows/nodejs-lint-reusable.yml
    permissions:
      contents: read
